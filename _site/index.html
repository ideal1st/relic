<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>RELIC: Research Library Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/assets/js/jszip.min.js"></script>
    <script src="/assets/js/epub.min.js"></script>
    <link href="/assets/css/relic.css" rel="stylesheet">
</head>

<body>
    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
<div id="drawer" class="drawer">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h5 class="mb-0 fw-bold text-info">Library Explorer</h5>
        <button class="btn-close" onclick="toggleDrawer()"></button>
    </div>
    
    <p class="small fw-bold text-muted text-uppercase mb-2">History & Pins</p>
    <div id="folder-list" class="folder-list-container"></div>

    <div class="mt-auto pt-3 border-top">
        <div class="d-grid gap-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="exportData()">Export Backup</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="triggerImport()">Import Backup</button>
            <input type="file" id="import-file" class="d-none" accept=".json" onchange="importData(event)">
            <button class="btn btn-sm btn-outline-danger" onclick="clearCache()">Factory Reset App</button>
        </div>
    </div>
</div>

    <nav class="navbar py-3 shadow-sm sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-light me-3" onclick="toggleDrawer()">
                <i data-lucide="menu"></i>
            </button>
            <span class="h4 mb-0 fw-bold"><a class="text-light" href="http://localhost:4000" style="text-decoration: none;">🔮 RELIC</a> </span>
        </div>
        <button class="btn btn-info fw-bold text-white shadow-sm" onclick="initLibrary()">
            <i data-lucide="folder-plus" class="me-2"></i> Add Folder
        </button>
    </div>
</nav>

    <div class="container mt-4">
        <div class="row g-3 mb-4 p-3 bg-white rounded shadow-sm align-items-end">
    <div class="col-md-8">
        <label class="form-label small fw-bold text-muted">SEARCH COLLECTIONS</label>
        <input type="text" id="search" class="form-control" placeholder="Filter titles, tags, or notes..." oninput="renderGrid()">
    </div>
    <div class="col-md-4 d-flex align-items-end gap-2">
        <div class="flex-grow-1">
            <label class="form-label small fw-bold text-muted">SORTING</label>
            <select id="sort" class="form-select" onchange="renderGrid()">
                <option value="name">Title (A-Z)</option>
                <option value="size">Size</option>
                <option value="date">Date</option>
                <option value="type">File Type</option>
                <option value="pages">Page Count</option>
            </select>
        </div>
        <div class="btn-group btn-group-sm mb-1">
            <button class="btn btn-outline-secondary active" id="view-grid" onclick="setView('grid')">
                <i data-lucide="layout-grid"></i>
            </button>
            <button class="btn btn-outline-secondary" id="view-list" onclick="setView('list')">
                <i data-lucide="list"></i>
            </button>
        </div>
    </div>
</div>
<div id="grid"></div>

        <p>Check the README <a href="./readme">here</a>.</p>

    </div>
    <div id="reader-overlay">
    <div class="d-flex justify-content-between p-2 text-white" style="background: #2c3e50;">
        <span id="reading-title" class="text-truncate fw-bold ms-2"></span>
        <button class="btn btn-sm btn-danger px-4" onclick="closeReader()">Close</button>
    </div>
    <div class="reader-layout">
        <div class="pdf-viewer">
            <iframe id="pdf-viewer-frame" src="" width="100%" height="100%" style="display:none; border:none;"></iframe>
            <canvas id="pdf-canvas" style="display:none; width:100%;"></canvas> <!-- Mobile PDF -->
            <div id="epub-viewer" style="display:none; height:100%; background:white;"></div> <!-- EPUB -->
            <!-- EPUB Navigation Overlay -->
            <div id="epub-controls" style="display:none; position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; width: 300px;">
                <div class="bg-dark p-2 rounded shadow text-center">
                    <!-- Progress Bar -->
                    <div class="progress-container mb-2" style="position: relative; height: 20px;">
                        <input type="range" id="epub-slider" class="form-range" min="0" max="100" value="0" step="1" oninput="seekEpub(this.value)" style="cursor: pointer;">
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <button class="btn btn-outline-light btn-xs" onclick="prevPage()"><i data-lucide="chevron-left"></i></button>
                        <span id="epub-percent" class="text-white small fw-bold">0%</span>
                        <button class="btn btn-outline-light btn-xs" onclick="nextPage()"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
            </div>
            <div id="cbz-viewer" style="display:none; height:100%; overflow-y:auto;"></div> <!-- CBZ -->
        </div>
            <div class="notes-sidebar">
            <h6 class="fw-bold border-bottom pb-2">Reading Notes</h6>
            
            <div class="mb-3 mt-1">
                <input type="text" id="note-search" class="form-control form-control-sm" 
                       placeholder="Find in these notes..." oninput="renderNotes()">
            </div>

            <div id="notes-list" class="flex-grow-1"></div>
            
            <div class="mt-3 bg-light p-3 rounded border">
                <div class="input-group input-group-sm mb-2">
                    <!-- Dynamic label that changes based on format -->
                    <span class="input-group-text" id="loc-label">Location:</span>
                    <input type="text" id="note-location" class="form-control" placeholder="Current location..." readonly>
                    <!-- Hidden field to store the raw CFI for EPUBs -->
                    <input type="hidden" id="note-cfi">
                </div>
                <textarea id="note-text" class="form-control form-control-sm mb-2" rows="3" placeholder="Add research note..."></textarea>
                <button class="btn btn-info btn-sm w-100 text-white" onclick="addNote()">Save to Database</button>
            </div>
        </div>
    </div>
</div>

    <script src="/assets/js/relic.js"></script>
</body>
</html>
